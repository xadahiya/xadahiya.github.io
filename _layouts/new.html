<!doctype html>
<html lang="en-US">
<head>
  <title>{% if page.title %}{{ page.title }} {% else %} {{ site.name }} – {{ site.description }} {% endif %}</title>
  {% include meta.html %}
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="HandheldFriendly" content="true">
  <meta name="author" content="xadahiya" >

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Jost%3A0%2C100%3B0%2C200%3B0%2C300%3B0%2C400%3B0%2C500%3B0%2C600%3B0%2C700%3B0%2C800%3B0%2C900%3B1%2C100%3B1%2C200%3B1%2C300%3B1%2C400%3B1%2C500%3B1%2C600%3B1%2C700%3B1%2C800%3B1%2C900%7CCaveat%3A400%3B500%3B600%3B700&#038;display=swap" type="text/css" media="all" >
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto%3A100%2C100italic%2C200%2C200italic%2C300%2C300italic%2C400%2C400italic%2C500%2C500italic%2C600%2C600italic%2C700%2C700italic%2C800%2C800italic%2C900%2C900italic%7CRoboto+Slab%3A100%2C100italic%2C200%2C200italic%2C300%2C300italic%2C400%2C400italic%2C500%2C500italic%2C600%2C600italic%2C700%2C700italic%2C800%2C800italic%2C900%2C900italic&#038;display=auto" type="text/css" media="all" >

  <!-- CSS STYLES -->

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vendors/bootstrap.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/fonts/font-awesome/css/font-awesome.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vendors/magnific-popup.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vendors/splitting.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vendors/swiper.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/vendors/animate.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css" type="text/css" media="all" >
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/dark.css" type="text/css" media="all" >
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  <meta name="google-site-verification" content="6ADAo9Ij5vEut5Jw6CsvR_s8Rx_mWw3WwUe_CsTDDMc" />
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" media="print" onload="this.media='all'"/>
  <!-- <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" media="print" /> -->

  <!-- Favicon -->
	<link rel="shortcut icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon">
	<link rel="icon" href="{{ site.baseurl }}/favicon.ico" type="image/x-icon">

</head>

<body class="home dark-skin">
	<div class="container-page">

		<!-- Preloader -->
		<div class="preloader">
			<div class="centrize full-width">
				<div class="vertical-center">
					<div class="spinner-logo">
						<img src="{{ site.baseurl }}/assets/images/logo2.png" alt="Luique - Personal Portfolio HTML Template" >
						<div class="spinner-dot"></div>
						<div class="spinner spinner-line"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- Header -->
		<header class="header">
			<div class="header__builder">
        <div class="row">
          <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4">

            <!-- logo -->
            <div class="logo">
              <a href="{{ site.baseurl }}">
                <img width="228" height="38" src="{{ site.baseurl }}/assets/images/logo2.png" alt="" >
              </a>
            </div>

          </div>
          <div class="col-xs-8 col-sm-8 col-md-8 col-lg-8 align-right">

						<!-- menu btn -->
						<a href="{{ site.baseurl }}" class="menu-btn">
							<span></span>
							<span></span>
						</a>

						<!-- Menu Full Overlay -->
						<div class="menu-full-overlay">
							<div class="menu-full-container">
								<div class="container">
									<div class="row">
										<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12">

											<!-- menu full -->
											<div class="menu-full">
												<ul class="menu-full">
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}">Home</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}services-section">Services</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}skills-section">Skills</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}works-section">Works</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}resume-section">Resume</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}testimonials-section">Testimonials</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}pricing-section">Pricing</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}blog-section">Blog</a>
													</li>
													<li class="menu-item">
														<a class="splitting-text-anim-2" data-splitting="chars" href="{{ site.baseurl }}contact-section">Contact</a>
													</li>
													<li class="menu-item menu-item-has-children has-children">
														<a class="splitting-text-anim-2" data-splitting="chars">Pages</a>
														<ul class="sub-menu">
															<li class="menu-item">
																<a class="splitting-text-anim-1" data-splitting="chars" href="works-list.html">Works (List)</a>
															</li>
															<li class="menu-item">
																<a class="splitting-text-anim-1" data-splitting="chars" href="works.html">Works (Grid)</a>
															</li>
															<li class="menu-item">
																<a class="splitting-text-anim-1" data-splitting="chars" href="work-single.html">Work Single Page</a>
															</li>
															<li class="menu-item">
																<a class=" splitting-text-anim-1" data-splitting="chars" href="blog.html">Blog</a>
															</li>
															<li class="menu-item">
																<a class="splitting-text-anim-1" data-splitting="chars" href="blog-single.html">Single Post</a>
															</li>
														</ul>
													</li>
												</ul>
											</div>

											<!-- social -->
											<div class="menu-social-links">
												<a href="http://dribbble.com" target="blank" class="scrolla-element-anim-1" title="dribbble">
													<i class="fab fa-dribbble"></i>
												</a>
												<a href="http://twitter.com" target="blank" class="scrolla-element-anim-1" title="twitter">
													<i class="fab fa-twitter"></i>
												</a>
												<a href="http://behance.com" target="blank" class="scrolla-element-anim-1" title="behance">
													<i class="fab fa-behance"></i>
												</a>
											</div>

											<div class="v-line-block"><span></span></div>

										</div>
									</div>
								</div>
							</div>
							<div class="menu-overlay"></div>
						</div>

          </div>
        </div>
      </div>
    </header>

		<!-- Wrapper -->
		<div class="wrapper">
      {{ content }}
		</div>

		<!-- Footer -->
		<div class="footer">
			<div class="footer__builder">
        <div class="container">
          <div class="row">
            <div class="col-xs-12 col-sm-12 col-md-4 col-lg-4">

              <div class="social-links scrolla-element-anim-1 scroll-animate" data-animate="active">
                {% include svg-icons.html %}
              </div>
            </div>
          </div>
        </div>
			</div>
		</div>

	</div>

	<!-- cursor -->
	<div class="cursor"></div>

  <script src="{{ site.baseurl }}/assets/js/jquery.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/jquery.validate.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/bootstrap.js"></script>
  <script src="{{ site.baseurl }}/assets/js/swiper.js"></script>
  <script src="{{ site.baseurl }}/assets/js/splitting.js"></script>
  <script src="{{ site.baseurl }}/assets/js/jarallax.min.js"></script>
  <script src="{{ site.baseurl }}/assets/js/magnific-popup.js"></script>
  <script src="{{ site.baseurl }}/assets/js/imagesloaded.pkgd.js"></script>
  <script src="{{ site.baseurl }}/assets/js/isotope.pkgd.js"></script>
  <script src="{{ site.baseurl }}/assets/js/jquery.scrolla.js"></script>
  <script src="{{ site.baseurl }}/assets/js/skrollr.js"></script>
  <script src="{{ site.baseurl }}/assets/js/jquery.cookie.js"></script>
  <script src="{{ site.baseurl }}/assets/js/typed.js"></script>
  <script src="{{ site.baseurl }}/assets/js/common.js"></script>

</body>
</html>
