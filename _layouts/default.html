<!DOCTYPE html>
<html lang="en-US">

<head>
  <title>{% if page.title %}{{ page.title }} {% else %} {{ site.name }} – {{ site.description }} {% endif %}</title>

  {% include meta.html %}

  <link rel="shortcut icon" type="image/png" href="{{ site.baseurl}}/images/favicon.ico">
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" media="print" onload="this.media='all'"/>
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <meta name="google-site-verification" content="6ADAo9Ij5vEut5Jw6CsvR_s8Rx_mWw3WwUe_CsTDDMc" />
</head>

<body>
  <div class="wrapper-masthead">
    <div class="container">
      <header class="masthead clearfix">
        <a href="{{ site.baseurl }}/" class="site-avatar"><img class="site-avatar" alt="avatar image" src="{{ site.baseurl }}/images/avatar.png" /></a>

        <div class="site-info">
          <h1 class="site-name"><a href="{{ site.baseurl }}/">{{ site.name }}</a></h1>
          <p class="site-description">{{ site.description }}</p>
        </div>

        <nav>
          <a href="{{ site.baseurl }}/">Home</a>
          <a href="{{ site.baseurl }}/blog/categories">Blog</a>
          <a href="{{ site.baseurl }}/publications">Publications</a>
          <a href="{{ site.baseurl }}/projects">Projects</a>
          <a href="{{ site.baseurl }}/resume.pdf">Résumé</a>
        </nav>
      </header>
    </div>
  </div>

  <div id="main" role="main" class="container entry-index">
    {{ content }}
  </div>

  <div class="wrapper-footer">
    <div class="container">
      <footer class="footer">
        <span class="footer-text">Get in Touch!</span>
        {% include svg-icons.html %}
      </footer>
    </div>
  </div>
</body>

</html>
