<div class="palette" data-palette hidden>
  <div class="palette__backdrop" data-palette-close></div>
  <div class="palette__panel" role="dialog" aria-modal="true" aria-label="Command menu">
    <div class="palette__search">
      <svg aria-hidden="true"><use href="#i-search"/></svg>
      <input type="text" data-palette-input placeholder="Jump to a section, copy email, open a post…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" aria-label="Search commands">
      <kbd>esc</kbd>
    </div>
    <ul class="palette__list" id="palette-list" role="listbox" data-palette-list data-lenis-prevent></ul>
    <div class="palette__foot mono"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> select</span><span><kbd>esc</kbd> close</span></div>
  </div>
</div>
<script type="application/json" id="xa-posts">[{% for p in site.posts %}{"t":{{ p.title | jsonify }},"u":{{ p.url | relative_url | jsonify }},"d":{{ p.date | date: "%b %Y" | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
