<script>
  /* Boot: runs before first paint — motion preference and the JS flag. */
  (function (d) {
    var r = d.documentElement, m = 'auto';
    try { m = localStorage.getItem('xa-motion') || 'auto'; } catch (e) {}
    r.classList.remove('no-js'); r.classList.add('js');
    if (location.hash.length > 1) r.classList.add('cv-off'); /* deep links: render everything so the jump lands exactly */
    if (m === 'off' || (m === 'auto' && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) r.classList.add('reduce-motion');
    /* If the script never boots (blocked, old browser), drop the preloader and show everything. */
    setTimeout(function () { if (!window.XA || !window.XA.booted) r.classList.add('no-anim'); }, 3500);
  })(document);
</script>
